<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoio ao Idoso</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 22px; /* Fonte maior para facilitar a leitura */
            line-height: 1.6;
            background-color: #f4f4f9;
            color: #111;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        h1 { color: #0056b3; font-size: 32px; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #ccc;
            margin-bottom: 20px;
        }
        button {
            font-size: 20px;
            padding: 10px 20px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Portal de Apoio ao Idoso</h1>
    
    <div class="card">
        <h2>Como usar o WhatsApp?</h2>
        <p>Aprenda a mandar mensagens de texto e áudio para a sua família de forma simples.</p>
    </div>

    <div class="card">
        <h2>Telefones Úteis</h2>
        <p><strong>SAMU:</strong> 192</p>
        <p><strong>Disque Direitos Humanos:</strong> 100</p>
    </div>
</body>
</html>
